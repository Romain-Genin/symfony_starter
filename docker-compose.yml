# Déploiement PRODUCTION via Coolify.
# Le dev local utilise compose.yaml (voir README).
networks:
  coolify:
    external: true

services:
  php:
    build:
      context: .
      target: php
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DEFAULT_URI: ${DEFAULT_URI}
      APP_INDEXABLE: ${APP_INDEXABLE:-0}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      # Fichiers envoyés depuis l'admin : hors du dossier public, servis par Symfony, conservés entre deux déploiements.
      - storage:/var/www/html/var/storage
    networks:
      - coolify
      - default

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - php
    networks:
      - coolify
      - default

volumes:
  storage:
