home:
    hero:
        title: A solid foundation to launch
        title_highlight: your next project
        text: 'Essential pages, back office, transactional emails, SEO, accessibility and encrypted data: everything is ready, all that is left is to build.'
        cta: Contact us
        discover: Discover
    features:
        title: All the essentials, already wired
        intro: Proven building blocks, carefully configured, to start fast without technical debt.
        fast:
            title: Fast by default
            text: Turbo Drive for instant navigation, AssetMapper without a Node build, HTTP cache and OPcache in production.
        design:
            title: Tailwind v4 design system
            text: Theme centralized in CSS variables, reusable Twig Components (buttons, alerts, cards…).
        a11y:
            title: Accessible
            text: Skip link, visible focus, annotated forms, page change announcements, reduced motion preferences respected.
        encryption:
            title: Encrypted data
            text: Personal data encrypted in the database (XChaCha20-Poly1305), search by fingerprint, automatable GDPR purge.
        emails:
            title: Transactional emails
            text: Brevo in production, Mailpit locally, responsive templates written in Twig.
        admin:
            title: Back office
            text: EasyAdmin 5 to manage users and messages, PDF export included.
    cta:
        title: Have a project in mind?
        text: 'Let''s talk: we reply within 2 business days.'
        button: Write a message
