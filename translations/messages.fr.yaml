home:
    hero:
        title: Un socle solide pour lancer
        title_highlight: votre prochain projet
        text: 'Pages essentielles, back-office, emails transactionnels, SEO, accessibilité et données chiffrées : tout est prêt, il ne reste qu''à construire.'
        cta: Nous contacter
        discover: Découvrir
    features:
        title: Tout l'essentiel, déjà branché
        intro: Des briques éprouvées, configurées avec soin, pour démarrer vite sans dette technique.
        fast:
            title: Rapide par défaut
            text: Turbo Drive pour une navigation instantanée, AssetMapper sans build Node, cache HTTP et OPcache en production.
        design:
            title: Design system Tailwind v4
            text: Thème centralisé en variables CSS, Twig Components réutilisables (boutons, alertes, cartes…).
        a11y:
            title: Accessible
            text: Lien d'évitement, focus visible, formulaires annotés, annonces des changements de page, respect des préférences de mouvement.
        encryption:
            title: Données chiffrées
            text: Données personnelles chiffrées en base (XChaCha20-Poly1305), recherche par empreinte, purge RGPD automatisable.
        emails:
            title: Emails transactionnels
            text: Brevo en production, Mailpit en local, templates responsive écrits en Twig.
        admin:
            title: Back-office
            text: EasyAdmin 5 pour gérer utilisateurs et messages, export PDF inclus.
    cta:
        title: Un projet en tête ?
        text: 'Parlons-en : nous vous répondons sous 48 heures ouvrées.'
        button: Écrire un message
