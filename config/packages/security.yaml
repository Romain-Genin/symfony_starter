security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Chargement via UserRepository::loadUserByIdentifier() (email chiffré → recherche par blind index)
        app_user_provider:
            entity:
                class: App\Entity\User

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password
                default_target_path: app_account
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 semaines
                signature_properties: ['password']
            # 5 tentatives / 15 min par identifiant + IP
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Préfixe de langue facultatif (/fr/mon-compte) : module multilingue
        - { path: '^/(?:[a-z]{2}(?:[-_][A-Za-z]{2,4})?/)?mon-compte', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
