twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/tailwind_theme.html.twig']
    paths:
        '%kernel.project_dir%/assets/styles': styles
        '%kernel.project_dir%/assets/images': images
    date:
        format: 'd/m/Y H:i'
        timezone: 'Europe/Paris'
    globals:
        # Informations de l'entreprise / du site : config/packages/app_site.yaml
        site: '%app.site%'
        cookie_consent_version: '%app.cookie_consent_version%'
        indexable: '%app.indexable%'

when@test:
    twig:
        strict_variables: true
