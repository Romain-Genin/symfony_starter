# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Routes toujours servies à la racine du site, quelle que soit la langue.
# Les pages du site (src/Controller/) sont importées par src/Kernel.php : préfixées
# par /{_locale} quand le module multilingue est installé (voir README, « Modules optionnels »).
#
# Pour lister les routes : bin/console debug:router

seo:
    resource: ../src/Controller/SeoController.php
    type: attribute
