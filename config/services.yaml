# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.contact_recipient: '%env(CONTACT_RECIPIENT)%'
    # Autorise l'indexation par les moteurs (robots.txt, meta robots, X-Robots-Tag)
    app.indexable: '%env(bool:APP_INDEXABLE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $contactRecipient: '%app.contact_recipient%'
            array $site: '%app.site%'

    App\:
        resource: '../src/'

    # Public : injecté dans le type Doctrine « encrypted » au boot du Kernel
    App\Security\Encryption\Encryptor:
        public: true
