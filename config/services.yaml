parameters:
    mailer_sender_email: '%env(MAILER_SENDER_EMAIL)%'
    mailer_sender_name:  '%env(MAILER_SENDER_NAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Mailer\AppMailer:
        arguments:
            $senderEmail: '%mailer_sender_email%'
            $senderName:  '%mailer_sender_name%'
